apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: telemetry-enricher
  namespace: processing
spec:
  image: local/flink-telemetry-job:dev
  imagePullPolicy: IfNotPresent
  flinkVersion: v1_20
  serviceAccount: flink
  flinkConfiguration:
    taskmanager.numberOfTaskSlots: "2"
    execution.checkpointing.interval: "10s"
    execution.checkpointing.min-pause: "5s"
    execution.checkpointing.timeout: "2min"
    execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
    state.backend.type: hashmap
    state.checkpoint-storage: filesystem
    state.checkpoints.dir: s3://flink-checkpoints/telemetry-enricher
    state.savepoints.dir: s3://flink-savepoints/telemetry-enricher
    s3.endpoint: http://minio.storage.svc.cluster.local:9000
    s3.path.style.access: "true"
    s3.connection.ssl.enabled: "false"
    restart-strategy.type: fixed-delay
    restart-strategy.fixed-delay.attempts: "10"
    restart-strategy.fixed-delay.delay: "5s"
    metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
    metrics.reporter.prom.port: "9249"
  podTemplate:
    metadata:
      labels:
        monitoring: flink
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: flink-main-container
          ports:
            - name: metrics
              containerPort: 9249
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: local-kafka-kafka-bootstrap.streaming.svc.cluster.local:9092
            - name: KAFKA_RAW_TOPIC
              value: machine.telemetry.raw
            - name: KAFKA_ENRICHED_TOPIC
              value: machine.telemetry.enriched
            - name: KAFKA_DLQ_TOPIC
              value: machine.telemetry.dlq
            - name: PROCESSING_DELAY_MS
              value: "0"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: access-key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: secret-key
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
  jobManager:
    resource:
      cpu: 0.25
      memory: 768m
  taskManager:
    resource:
      cpu: 0.5
      memory: 1024m
  job:
    jarURI: local:///opt/flink/usrlib/flink-telemetry-job.jar
    entryClass: dev.learning.streaming.TelemetryJob
    parallelism: 2
    upgradeMode: savepoint
    state: running
